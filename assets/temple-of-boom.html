<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Temple of Boom</title>
<style>
  html, body { margin:0; padding:0; background:#000; width:100%; height:100%; overflow:hidden; }
  #stage { position:absolute; top:0; left:0; transform-origin:top left; }
  ruffle-player { width:100% !important; height:100% !important; display:block; }
</style>
</head>
<body>
<!--
  Temple of Boom only ever shipped as Flash. Ruffle (an open-source,
  ad-free Flash emulator, https://ruffle.rs) runs the original .swf
  natively in-browser via WebAssembly -- no Flash plugin, no ad SDK,
  nothing but our own markup and Ruffle's own script.

  Built via the JS API (not an <embed>/<object> tag) because our game
  CSP sets object-src 'none' to keep real Flash/plugin-based ad embeds
  out -- Ruffle's <ruffle-player> is a plain custom element created in
  script, so it's governed by script-src instead, which already allows
  this page's own script.
-->
<div id="stage"></div>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.addEventListener("DOMContentLoaded", () => {
    // The .swf's own ActionScript locks Stage.scaleMode to noScale, so
    // Ruffle gives it a canvas at whatever CSS size we ask for but the
    // movie only ever draws into its native 624x400 region of it, top-left
    // -- the rest stays blank. Simply resizing the canvas bigger just grows
    // the blank part. So instead #stage is kept pinned at the native 624x400
    // (canvas == content, no blank space) and scaled up as a whole via a
    // CSS transform to fill the viewport, same as zooming an image.
    const NATIVE_W = 624, NATIVE_H = 400;
    const stage = document.getElementById("stage");
    stage.style.width = NATIVE_W + "px";
    stage.style.height = NATIVE_H + "px";
    function fitStage(){
      const availW = window.innerWidth, availH = window.innerHeight;
      const scale = Math.min(availW / NATIVE_W, availH / NATIVE_H);
      stage.style.transform = "scale(" + scale + ")";
      stage.style.left = ((availW - NATIVE_W * scale) / 2) + "px";
      stage.style.top = ((availH - NATIVE_H * scale) / 2) + "px";
    }
    fitStage();
    window.addEventListener("resize", fitStage);

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    stage.appendChild(player);
    player.load("https://files.twoplayergames.org/files/games/other/Temple_of_Boom.swf");
  });
</script>
</body>
</html>
