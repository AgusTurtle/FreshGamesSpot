<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshGamesSpot — Juegos gratis online</title>
<meta name="description" content="Cientos de juegos gratis online. Sin descargas, jugá directo en el navegador.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.85em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://img.gamemonetize.com">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="logo" data-nav="home">
      <span class="logo-bolt">🎮</span>
      <span class="logo-text">Fresh<strong>GamesSpot</strong></span>
    </a>

    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Buscar un juego…" autocomplete="off">
      <button id="clearSearch" class="clear-search" title="Borrar búsqueda" hidden>✕</button>
    </div>

    <button id="favToggleNav" class="nav-fav-btn" title="Mis favoritos">
      <span class="star">★</span><span class="fav-label">Favoritos</span>
    </button>
  </div>

  <nav class="cat-nav" id="catNav" aria-label="Categorías">
    <!-- filled by JS -->
  </nav>
</header>

<main id="mainContent">

  <section id="continueSection" class="rail" hidden>
    <h2 class="rail-title">Seguir jugando</h2>
    <div id="continueRow" class="rail-row"></div>
  </section>

  <section id="homeSections"></section>

  <section id="gridSection" class="grid-section" hidden>
    <div class="grid-header">
      <h1 id="sectionTitle">Todos los juegos</h1>
      <span id="resultCount" class="result-count"></span>
    </div>
    <div id="gameGrid" class="game-grid"></div>
    <div id="emptyState" class="empty-state" hidden>
      <p>No encontramos juegos con ese nombre.</p>
    </div>
    <button id="loadMoreBtn" class="load-more-btn">Cargar más juegos</button>
  </section>

</main>

<footer class="site-footer">
  <p>FreshGamesSpot — juegos HTML5 gratuitos para jugar directo desde el navegador, sin instalar nada.</p>
</footer>

<!-- Player overlay -->
<div id="playerOverlay" class="player-overlay" hidden>
  <div class="player-bar">
    <button id="playerBack" class="player-btn player-back">← Volver</button>
    <h2 id="playerTitle" class="player-title"></h2>
    <div class="player-actions">
      <button id="playerFav" class="player-btn player-fav" title="Agregar a favoritos">★</button>
      <button id="playerFullscreen" class="player-btn" title="Pantalla completa">⛶</button>
      <button id="playerClose" class="player-btn player-close" title="Cerrar">✕</button>
    </div>
  </div>
  <div class="player-frame-wrap">
    <div id="playerLoading" class="player-loading">Cargando juego…</div>
    <iframe id="playerFrame" class="player-frame" allow="fullscreen; gamepad; autoplay" allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock allow-orientation-lock allow-presentation"></iframe>
  </div>
  <div class="player-info">
    <p id="playerDescription"></p>
    <div id="playerTags" class="player-tags"></div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
